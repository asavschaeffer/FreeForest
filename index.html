<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bullet Hell Tower Defense</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            margin-top: 20px;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #444;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #endScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #pauseScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        #debugPanel {
            width: 800px;
            height: 150px;
            overflow-y: auto;
            background-color: #333;
            border: 2px solid #444;
            margin-top: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
        }
        .debug-info {
            margin: 2px 0;
        }
        .debug-player { color: #6495ED; }
        .debug-enemy { color: #FF6347; }
        .debug-projectile { color: #90EE90; }
        .debug-tower { color: #D3D3D3; }
        .debug-system { color: #FFD700; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="startScreen">
            <h1 style="color: white; margin-bottom: 30px;">Bullet Hell Tower Defense</h1>
            <button id="startButton">Start Game</button>
            <button id="quitButton">Quit Game</button>
        </div>
        <div id="endScreen" style="display: none;">
            <h1 style="color: white; margin-bottom: 30px;">Game Over!</h1>
            <button id="playAgainButton">Play Again</button>
            <button id="mainMenuButton">Main Menu</button>
            <button id="quitGameButton">Quit Game</button>
        </div>
        <div id="pauseScreen" style="display: none;">
            <h1 style="color: white; margin-bottom: 30px;">Paused</h1>
            <button id="resumeButton">Resume</button>
            <button id="pauseMainMenuButton">Main Menu</button>
            <button id="pauseQuitButton">Quit Game</button>
        </div>
    </div>
    <div id="debugPanel"></div>
    <div id="visualizationPanel" style="display: none; position: fixed; top: 20px; right: 20px; background: white; padding: 10px; border: 1px solid #ccc;">
        <canvas id="movementChart" width="400" height="300"></canvas>
        <button onclick="analyzeGameplay()">Analyze Last Session</button>
    </div>
    <script src="structured_logging.js"></script>
    <script src="game.js"></script>
    <script src="logging_integration.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
